version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: newseye
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5.12.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build: ./newseye-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/newseye
      - SECRET_KEY=dev-secret-key-change-this-in-production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      # Add other necessary API keys here or through a .env file
    depends_on:
      - postgres
      - redis
      - neo4j

  frontend:
    build: ./newseye-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  crawler:
    build: ./newseye-news-crawler
    environment:
      - BACKEND_API_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    # This keeps the container alive or runs periodic tasks
    command: ["sh", "-c", "while true; do python run_crawler.py; sleep 3600; done"]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
